name: Build Hisab Pro APK
on:
  push:
    branches: [ main ]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build debug APK
        run: gradle :app:assembleDebug --stacktrace
      - name: Rename APK
        run: cp app/build/outputs/apk/debug/app-debug.apk Hisab-Pro-v1.0.apk
      - uses: actions/upload-artifact@v4
        with:
          name: Hisab-Pro-APK
          path: Hisab-Pro-v1.0.apk
          retention-days: 30
