name: Build and Publish Hisab Pro APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build debug APK
        run: gradle :app:assembleDebug --stacktrace

      - name: Prepare direct-download APK
        run: cp app/build/outputs/apk/debug/app-debug.apk Hisab-Pro.apk

      - name: Keep Actions backup
        uses: actions/upload-artifact@v4
        with:
          name: Hisab-Pro-APK
          path: Hisab-Pro.apk
          retention-days: 30

      - name: Publish stable GitHub download
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest Hisab-Pro.apk \
            --title "Hisab Pro - Latest APK" \
            --notes "Latest installable Hisab Pro APK. Built automatically from the main branch."
